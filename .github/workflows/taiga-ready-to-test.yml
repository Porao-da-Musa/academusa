name: Move Taiga Task

on:
  pull_request:
    types: [closed]

jobs:
  taiga:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Login Taiga
        id: taiga_auth
        run: |
          RESPONSE=$(curl -s -X POST https://api.taiga.io/api/v1/auth \
          -H "Content-Type: application/json" \
          -d '{
            "type": "normal",
            "username": "'"$TAIGA_USERNAME"'",
            "password": "'"$TAIGA_PASSWORD"'"
          }')

          TOKEN=$(echo $RESPONSE | jq -r '.auth_token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
        env:
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}

      - name: Update task
        run: |
          curl -X PATCH https://api.taiga.io/api/v1/tasks/$TASK_ID \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"status": 12}'
        env:
          TOKEN: ${{ steps.taiga_auth.outputs.token }}
