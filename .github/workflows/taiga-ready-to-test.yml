name: Move Taiga Card to Ready to Test

on:
  pull_request:
    types: [closed]

jobs:
  move-taiga-card:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract Taiga User Story ID from PR body
        id: taiga
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt

          US_ID=$(grep -oE "/us/[0-9]+" pr_body.txt | head -n1 | grep -oE "[0-9]+")

          if [ -z "$US_ID" ]; then
            echo "No Taiga User Story found in PR description"
            exit 1
          fi

          echo "Found Taiga User Story: $US_ID"
          echo "us_id=$US_ID" >> $GITHUB_OUTPUT

      - name: Authenticate with Taiga
        id: taiga_auth
        env:
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.taiga.io/api/v1/auth \
          -H "Content-Type: application/json" \
          -d '{
            "type": "normal",
            "username": "'"$TAIGA_USERNAME"'",
            "password": "'"$TAIGA_PASSWORD"'"
          }')

          TOKEN=$(echo "$RESPONSE" | jq -r '.auth_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to authenticate with Taiga"
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Move User Story to Ready to Test
        env:
          TOKEN: ${{ steps.taiga_auth.outputs.token }}
          US_ID: ${{ steps.taiga.outputs.us_id }}
          READY_TO_TEST_STATUS_ID: 10737797
        run: |
          curl -s -X PATCH https://api.taiga.io/api/v1/userstories/$US_ID \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"status\": $READY_TO_TEST_STATUS_ID
          }"
